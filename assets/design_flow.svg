<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #5b6470; stroke-width: 1.3; }
      .src { fill: #eef2f7; }
      .lay { fill: #e7f0ff; stroke: #3b6fd4; }
      .proc { fill: #fff3df; stroke: #c98a1b; }
      .sim { fill: #eaf7ee; stroke: #2f8f5b; }
      .ckt { fill: #f3eafc; stroke: #7b4fc4; }
      .t { fill: #1c2430; font-weight: 600; }
      .s { fill: #48515e; font-size: 11.5px; }
      .h { fill: #48515e; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
      .a { stroke: #5b6470; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="470" rx="10" fill="#fbfcfd" stroke="#d5dae1"/>

  <text x="24" y="30" class="h">PROCESS DEFINITION</text>
  <text x="84" y="268" class="h">DEVICE SIMULATION — every step loads the same GDS + .lbr pair into a Layer Builder</text>

  <!-- public data -->
  <rect x="24" y="48" width="170" height="170" rx="8" class="box src"/>
  <text x="109" y="104" text-anchor="middle" class="t">Public foundry data</text>
  <text x="109" y="126" text-anchor="middle" class="s">CORNERSTONE SOI220A</text>
  <text x="109" y="143" text-anchor="middle" class="s">open PDK repository</text>
  <text x="109" y="160" text-anchor="middle" class="s">+ design guidelines</text>

  <!-- layout branch -->
  <rect x="236" y="48" width="220" height="70" rx="8" class="box lay"/>
  <text x="346" y="77" text-anchor="middle" class="t">cornerstone_technology.py</text>
  <text x="346" y="97" text-anchor="middle" class="s">layers, rules, cross-sections, PDK</text>

  <rect x="498" y="48" width="200" height="70" rx="8" class="box lay"/>
  <text x="598" y="77" text-anchor="middle" class="t">rm_builder.py</text>
  <text x="598" y="97" text-anchor="middle" class="s">ring modulator layout + DRC</text>

  <rect x="732" y="48" width="170" height="70" rx="8" class="box lay"/>
  <text x="817" y="77" text-anchor="middle" class="t">rm_ring.gds</text>
  <text x="817" y="97" text-anchor="middle" class="s">layout</text>

  <!-- process branch -->
  <rect x="236" y="148" width="220" height="70" rx="8" class="box proc"/>
  <text x="346" y="177" text-anchor="middle" class="t">cornerstone_csv/*.csv</text>
  <text x="346" y="197" text-anchor="middle" class="s">stack, materials, doping</text>

  <rect x="498" y="148" width="200" height="70" rx="8" class="box proc"/>
  <text x="598" y="177" text-anchor="middle" class="t">process file compiler</text>
  <text x="598" y="197" text-anchor="middle" class="s">lumapi: FDTD + CHARGE, with QA</text>

  <rect x="732" y="148" width="170" height="70" rx="8" class="box proc"/>
  <text x="817" y="177" text-anchor="middle" class="t">cornerstone_process.lbr</text>
  <text x="817" y="197" text-anchor="middle" class="s">process file</text>

  <rect x="932" y="98" width="164" height="70" rx="8" class="box sim"/>
  <text x="1014" y="127" text-anchor="middle" class="t">Layer Builder</text>
  <text x="1014" y="147" text-anchor="middle" class="s">3D structure + doping</text>

  <path class="a" d="M194 100 H232"/>
  <path class="a" d="M194 166 H232"/>
  <path class="a" d="M456 83 H494"/>
  <path class="a" d="M698 83 H728"/>
  <path class="a" d="M456 183 H494"/>
  <path class="a" d="M698 183 H728"/>
  <path class="a" d="M902 83 H960 V94"/>
  <path class="a" d="M902 183 H960 V172"/>
  <path class="a" d="M1060 168 V226 H60 V282" stroke-dasharray="5 4"/>

  <!-- simulation steps -->
  <g>
    <rect x="24" y="286" width="160" height="78" rx="8" class="box sim"/>
    <text x="104" y="311" text-anchor="middle" class="t">1 · FDTD</text>
    <text x="104" y="331" text-anchor="middle" class="s">bus-ring coupling</text>
    <text x="104" y="348" text-anchor="middle" class="s">κ²(gap)</text>

    <rect x="204" y="286" width="160" height="78" rx="8" class="box sim"/>
    <text x="284" y="311" text-anchor="middle" class="t">2 · MODE FDE</text>
    <text x="284" y="331" text-anchor="middle" class="s">passive waveguide</text>
    <text x="284" y="348" text-anchor="middle" class="s">n_eff, n_g, bend loss</text>

    <rect x="384" y="286" width="160" height="78" rx="8" class="box sim"/>
    <text x="464" y="311" text-anchor="middle" class="t">3 · CHARGE</text>
    <text x="464" y="331" text-anchor="middle" class="s">PN junction</text>
    <text x="464" y="348" text-anchor="middle" class="s">carriers(V), C, Rs</text>

    <rect x="564" y="286" width="160" height="78" rx="8" class="box sim"/>
    <text x="644" y="311" text-anchor="middle" class="t">4 · HEAT</text>
    <text x="644" y="331" text-anchor="middle" class="s">heater</text>
    <text x="644" y="348" text-anchor="middle" class="s">temperature per mW</text>

    <rect x="744" y="286" width="160" height="78" rx="8" class="box sim"/>
    <text x="824" y="311" text-anchor="middle" class="t">5 · MODE FDE</text>
    <text x="824" y="331" text-anchor="middle" class="s">active waveguide</text>
    <text x="824" y="348" text-anchor="middle" class="s">Δn_eff(V), loss(V), Δn/mW</text>

    <rect x="936" y="286" width="160" height="78" rx="8" class="box ckt"/>
    <text x="1016" y="311" text-anchor="middle" class="t">6 · INTERCONNECT</text>
    <text x="1016" y="331" text-anchor="middle" class="s">ring modulator circuit</text>
    <text x="1016" y="348" text-anchor="middle" class="s">spectra, Q, tuning</text>
  </g>

  <!-- data passed between steps -->
  <path class="a" d="M644 364 V384 H800 V368"/>
  <text x="722" y="379" text-anchor="middle" class="s">temperature (.mat)</text>
  <path class="a" d="M464 364 V400 H848 V368"/>
  <text x="554" y="395" text-anchor="middle" class="s">carriers (.mat)</text>
  <path class="a" d="M904 325 H932"/>
  <path class="a" d="M284 364 V418 H1000 V368"/>
  <text x="374" y="413" text-anchor="middle" class="s">n_eff, n_g</text>
  <path class="a" d="M104 364 V436 H1032 V368"/>
  <text x="194" y="431" text-anchor="middle" class="s">κ²(gap)</text>
  <text x="560" y="458" text-anchor="middle" class="s">Step 6 returns the gap for critical coupling, which goes back into rm_builder.py.</text>
</svg>
