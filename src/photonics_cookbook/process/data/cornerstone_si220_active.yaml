# =============================================================================
#  CORNERSTONE 220 nm SOI -- ACTIVE platform (University of Southampton)
# =============================================================================
#  Process adapter for photonics-layout-cookbook.  Lengths in um, doping in cm^-3,
#  z = 0 at the BOX / device-silicon interface.
#
#  Where the numbers come from (all public, no NDA):
#   * Passive layers WG 3/0, SLAB 5/0, HEATER 39/0, PAD 41/0, LBL 100/0 are the
#     ones used by gdsfactory's open CORNERSTONE PDK `cspdk` (module cspdk.si220).
#     `photonics-cookbook check-pdk cornerstone_si220_active` compares them at runtime.
#   * Implant / via / electrode layers and doping levels: CORNERSTONE 220 nm SOI
#     active MPW design guidelines (47th call, Oct 2025) and the public layer
#     table of the Luceda CORNERSTONE PDK (P 7/0, N 8/0, P++ 9/0, N++ 11/0).
#     cspdk (v2.x) is passive-only, so these are added here.
#
#  !!  Teaching / simulation set-up only.  Before a tape-out ALWAYS take layer
#  !!  numbers, rules and doses from the design guidelines of the call you
#  !!  submit to (https://www.cornerstone.sotonfab.co.uk/).
#
#  YAML note: write exponents with a sign (1.0e+18).  PyYAML reads "1.0e18" as
#  a string; the loader converts it anyway, but other tools may not.
# =============================================================================
name: cornerstone_si220_active
foundry: CORNERSTONE (University of Southampton)
platform: 220 nm SOI, active (3 Si etches, 4 implants, 1 metal), C-band
version: "public design guidelines, MPW #47 (2025-10)"
wavelength_um: 1.55
references:
  - https://www.cornerstone.sotonfab.co.uk/
  - https://github.com/gdsfactory/cspdk
  - https://academy.lucedaphotonics.com/pdks/cornerstone/cornerstone
  - https://europractice-ic.com/technologies/photonics/cornerstone/

# Upstream gdsfactory PDK used for passive cells and for the layer cross-check.
upstream_pdk:
  python_package: cspdk
  modules: [cspdk.si220, cspdk.si220.cband]   # >=2.0 first, <2.0 fallback
  layer_names:                                 # role -> name in the PDK's LAYER enum
    core: WG
    slab: SLAB
    heater: HEATER
    pad: PAD
    label: LBL

# -----------------------------------------------------------------------------
# Materials: key -> names in the Lumerical databases
#   optical : FDTD / MODE material database
#   charge  : Finite Element IDE (CHARGE) "CT" database
#   mesh_order : Lumerical priority where objects overlap (lower = wins)
# -----------------------------------------------------------------------------
materials:
  si:
    kind: semiconductor
    optical: "Si (Silicon) - Palik"
    charge: "Si (Silicon)"
    mesh_order: 2
  sio2:
    kind: dielectric
    optical: "SiO2 (Glass) - Palik"
    charge: "SiO2 (Glass) - Sze"
    mesh_order: 3
  al:
    kind: conductor
    optical: "Al (Aluminium) - CRC"
    charge: "Al (Aluminium) - CRC"
    mesh_order: 1

# Unpatterned layers, bottom to top.
background:
  - {name: substrate, material: si,   zmin: -3.0, zmax: -2.0}   # Si handle (truncated)
  - {name: box,       material: sio2, zmin: -2.0, zmax:  0.0}   # 2 um buried oxide
  - {name: clad,      material: sio2, zmin:  0.0, zmax:  1.22}  # 1 um SiO2 above the 220 nm Si

# -----------------------------------------------------------------------------
# Drawn layers.  role -> GDS layer + physics.
#   kind: structure | etch | doping | via | metal | annotation
# -----------------------------------------------------------------------------
layers:
  core:
    gds: [3, 0]
    kind: structure
    material: si
    zmin: 0.0
    thickness: 0.22
    description: >
      Silicon Etch 2, light field (dark-field twin: 4/0). Drawn shapes keep the
      full 220 nm; undrawn silicon is etched by 120 nm.
  slab:
    gds: [5, 0]
    kind: structure
    material: si
    zmin: 0.0
    thickness: 0.10
    description: >
      Slab protection for Silicon Etch 3. Drawn shapes keep a 100 nm slab (rib
      waveguides, doped regions); everything not covered by core or slab is etched
      down to the BOX.
  shallow_etch:
    gds: [6, 0]
    kind: etch
    material: sio2
    depth: 0.07
    description: Silicon Etch 1, dark field, 70 nm (grating couplers).
  p:
    gds: [7, 0]
    kind: doping
    dopant: p
    concentration: 5.7e+17
    description: Low-dose p implant (dose option A ~5.7e17; option B ~2.25e17 cm^-3).
  n:
    gds: [8, 0]
    kind: doping
    dopant: n
    concentration: 1.1e+18
    description: Low-dose n implant (~1.1e18 cm^-3).
  ppp:
    gds: [9, 0]
    kind: doping
    dopant: p
    concentration: 1.0e+20
    description: High-dose p implant (P++, ~1e20 cm^-3) for ohmic contacts.
  npp:
    gds: [11, 0]
    kind: doping
    dopant: n
    concentration: 1.0e+20
    description: High-dose n implant (N++, ~1e20 cm^-3) for ohmic contacts.
  via:
    gds: [12, 0]
    kind: via
    material: al
    zmin: 0.10
    thickness: 1.12
    description: >
      Contact via to silicon; must be enclosed by P++ (9/0) or N++ (11/0). zmin is
      the slab top; the CHARGE exporter lands each via on the local silicon top.
  metal:
    gds: [13, 0]
    kind: metal
    material: al
    zmin: 1.22
    thickness: 1.6
    description: Electrode metal (~1.6 um stack) on the 1 um top cladding; also used for pads.
  heater:
    gds: [39, 0]
    kind: metal
    material: al
    zmin: 1.22
    thickness: 0.2
    description: >
      Heater filament layer used by cspdk (passive calls). In the active call heaters
      may be drawn in the electrode layer instead -- check the guidelines. Material
      and thickness here are placeholders.
  pad:
    gds: [41, 0]
    kind: metal
    material: al
    zmin: 1.42
    thickness: 1.0
    description: Heater contact pads used by cspdk (passive calls). Placeholder stack.
  outline:
    gds: [99, 0]
    kind: annotation
    description: Cell outline.
  label:
    gds: [100, 0]
    kind: annotation
    description: Text labels (not fabricated).
