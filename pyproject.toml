[project]
name = "photonics-layout-cookbook"
version = "0.2.0"
description = "A foundry-compatible silicon-photonics design flow on an open active PDK (CORNERSTONE SOI 220 nm): gdsfactory technology file, device layout, Lumerical process file, and FDTD / MODE / CHARGE / HEAT / INTERCONNECT simulations of a heater-tuned microring modulator."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LumaTrace" }]
requires-python = ">=3.12,<3.14"
keywords = ["silicon photonics", "gdsfactory", "layout", "PDK", "CORNERSTONE", "Lumerical", "microring modulator", "Layer Builder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # Layout engine.  The code is written against gdsfactory 9.5x.
    "gdsfactory>=9.5,<10",
    # DRC runner and headless preview images (klayout.db, klayout.rdb, klayout.lay).
    "klayout>=0.30",
    "numpy>=1.26",
    "matplotlib>=3.8",
]
# lumapi, the Python API of Ansys Lumerical, is not on PyPI.  It ships with Lumerical and is
# located at run time by lumerical_env.py (environment variable LUMERICAL_ROOT or the usual paths).

[project.urls]
Homepage = "https://github.com/q3430468220-tech/photonics-layout-cookbook"
Issues = "https://github.com/q3430468220-tech/photonics-layout-cookbook/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.uv]
# The repository is a set of scripts run from the checkout, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["build", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are fine in tables and docstrings
    "RUF001",  # allow unicode in strings
    "RUF002",
    "RUF003",
]
