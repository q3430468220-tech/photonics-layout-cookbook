[project]
name = "photonics-layout-cookbook"
version = "0.3.0"
description = "A course in foundry-compatible silicon-photonics design: a complete teaching PDK in gdsfactory, a heater-tuned microring modulator drawn with it, a Lumerical Layer Builder process file, and its FDTD / MODE / CHARGE / HEAT / INTERCONNECT simulations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LumaTrace" }]
requires-python = ">=3.12,<3.14"
keywords = ["silicon photonics", "gdsfactory", "layout", "PDK", "process file", "Lumerical", "Layer Builder", "microring modulator", "tutorial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # Layout engine.  The code is written against gdsfactory 9.5x.
    "gdsfactory>=9.5,<10",
    # DRC runner and headless preview images (klayout.db, klayout.rdb, klayout.lay).
    "klayout>=0.30",
    "numpy>=1.26",
    "matplotlib>=3.8",
]
# lumapi, the Python API of Ansys Lumerical, is not on PyPI.  It ships with Lumerical and is
# located at run time by lumerical_env.py (environment variable LUMERICAL_ROOT or the usual paths).

[project.urls]
Homepage = "https://github.com/q3430468220-tech/photonics-layout-cookbook"
Issues = "https://github.com/q3430468220-tech/photonics-layout-cookbook/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.uv]
# The repository is a set of scripts run from the checkout, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["build", "legacy", "*.md"]  # Markdown: the snippets of the course keep their hand-set alignment
src = [".", "more_processes/cornerstone_soi220a"]  # both hold first-party modules

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are fine in tables and docstrings
    "RUF001",  # allow unicode in strings
    "RUF002",
    "RUF003",
]
