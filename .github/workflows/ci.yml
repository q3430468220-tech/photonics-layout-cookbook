name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      # Nothing here needs Lumerical: the PDK, the layout, the DRC, the process tables,
      # and every figure redrawn from the result data kept in the repository.
      - name: Tests
        run: uv run pytest
      - name: Tests of the second process (CORNERSTONE SOI220A)
        working-directory: more_processes/cornerstone_soi220a
        run: uv run pytest
      - name: Technology file and KLayout technology
        run: uv run python gsip_technology.py
      - name: DRC self-test
        run: uv run python gsip_drc.py --demo
      - name: Ring modulator layout with DRC
        run: uv run python rm_builder.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: layout
          path: |
            rm_ring.gds
            build/rm_ring_klayout.png
            build/rm_ring_klayout_zoom.png
