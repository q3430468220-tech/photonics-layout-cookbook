name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      # Everything below runs without Lumerical: the PDK, the DRC self-test and the device layout.
      - name: Technology file and KLayout technology
        run: uv run python cornerstone_technology.py
      - name: DRC self-test
        run: uv run python cornerstone_drc.py --demo
      - name: Ring modulator layout with DRC
        run: uv run python rm_builder.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: layout
          path: |
            rm_ring.gds
            assets/rm_ring.png
            assets/rm_ring_zoom.png
